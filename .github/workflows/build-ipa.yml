name: Build iOS IPA for Sideloading

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build iOS Archive (Unsigned)
        run: |
          xcodebuild \
            -workspace ios/Calculator.xcworkspace \
            -scheme Calculator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Calculator.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Calculator.xcarchive/Products/Applications/Calculator.app Payload/
          zip -r Calculator.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-iOS-IPA
          path: Calculator.ipa
