name: Build iOS IPA for Sideloading

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          cd ios
          pod install
          cd ..

      - name: Build iOS Archive (Unsigned)
        run: |
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          cd ios
          xcodebuild \
            -workspace Calculator.xcworkspace \
            -scheme Calculator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
          cd ..

      - name: Package IPA
        run: |
          rm -rf Payload Calculator.ipa
          mkdir -p Payload
          APP_PATH=$(find build/App.xcarchive/Products/Applications -name "*.app" | head -n 1)
          echo "Packaging app bundle from: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r -y Calculator.ipa Payload
          ls -lh Calculator.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-iOS-IPA
          path: Calculator.ipa
