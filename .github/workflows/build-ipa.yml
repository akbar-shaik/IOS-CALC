name: Build iOS IPA for Sideloading

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project & Install Pods
        run: |
          echo "### 1. Expo Prebuild" >> $GITHUB_STEP_SUMMARY
          npx expo prebuild --platform ios --clean 2>&1 | tee -a $GITHUB_STEP_SUMMARY

          echo "### 2. CocoaPods Install" >> $GITHUB_STEP_SUMMARY
          cd ios
          pod install --repo-update 2>&1 | tee -a $GITHUB_STEP_SUMMARY || true
          cd ..

          echo "### 3. iOS Directory Contents" >> $GITHUB_STEP_SUMMARY
          find ios -maxdepth 2 >> $GITHUB_STEP_SUMMARY

      - name: Build iOS Archive (Unsigned)
        run: |
          if [ -d "ios/Calculator.xcworkspace" ]; then
            TARGET="-workspace ios/Calculator.xcworkspace"
          else
            TARGET="-project ios/Calculator.xcodeproj"
          fi
          echo "### 4. Xcode Build ($TARGET)" >> $GITHUB_STEP_SUMMARY

          xcodebuild \
            $TARGET \
            -scheme Calculator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/App.xcarchive/Products/Applications -name "*.app" | head -n 1)
          echo "Packaging app bundle from: $APP_PATH" >> $GITHUB_STEP_SUMMARY
          cp -r "$APP_PATH" Payload/
          zip -r Calculator.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-iOS-IPA
          path: Calculator.ipa
