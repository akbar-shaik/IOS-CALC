name: Build iOS IPA for Sideloading

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project & Install Pods
        run: |
          npx expo prebuild --platform ios --clean
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS Archive (Unsigned)
        run: |
          if [ -d "ios/Calculator.xcworkspace" ]; then
            TARGET="-workspace ios/Calculator.xcworkspace"
          else
            TARGET="-project ios/Calculator.xcodeproj"
          fi
          echo "### Xcode Build ($TARGET)" >> $GITHUB_STEP_SUMMARY

          xcodebuild \
            $TARGET \
            -scheme Calculator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          APP_PATH=$(find . -name "*.app" -path "*Products/Applications*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -not -path "*/Pods*" | head -n 1)
          fi
          echo "### Packaging IPA" >> $GITHUB_STEP_SUMMARY
          echo "Found app bundle at: $APP_PATH" >> $GITHUB_STEP_SUMMARY

          rm -rf Payload Calculator.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y Calculator.ipa Payload
          ls -lh Calculator.ipa >> $GITHUB_STEP_SUMMARY

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-iOS-IPA
          path: Calculator.ipa
