name: Build iOS IPA for Sideloading

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build iOS Archive & Package IPA (Unsigned)
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(0)); console.log(data.workspace.schemes[0]);")
          echo "Building workspace: $WORKSPACE with scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          mkdir -p Payload
          APP_PATH=$(find build/App.xcarchive/Products/Applications -name "*.app" | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Calculator.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-iOS-IPA
          path: Calculator.ipa
